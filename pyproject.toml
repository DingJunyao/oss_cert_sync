[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "oss-cert-sync"
version = "0.1.0"
description = "Push Caddy-managed TLS certificates to Aliyun OSS custom CNAME domains"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "oss2>=2.18,<3",
    "cryptography>=41",
]

[project.scripts]
oss-cert-sync = "oss_cert_sync.cli:main"

[tool.setuptools]
packages = ["oss_cert_sync"]
