[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cert-uploader"
version = "0.1.0"
description = "Push Caddy-managed TLS certificates to Aliyun OSS custom CNAME domains"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "oss2>=2.18,<3",
    "cryptography>=41",
]

[project.scripts]
cert-uploader = "cert_uploader.cli:main"

[tool.setuptools]
packages = ["cert_uploader"]
